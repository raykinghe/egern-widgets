name: "服务器监控"
description: "服务器监控小组件"

env_schema:
  SERVER_HOST:
    name: 主机地址
    description: SSH 服务器地址
    default_value: ""
  SERVER_PORT:
    name: 端口
    description: SSH 端口号
    default_value: "22"
  SERVER_USER:
    name: 用户名
    description: SSH 登录用户名
    default_value: "root"
  SERVER_KEY:
    name: 私钥
    description: SSH 私钥
    default_value: ""

scriptings:
- generic:
    name: 服务器监控
    script_url: https://raw.githubusercontent.com/raykinghe/egern-widgets/refs/heads/main/Server.js

widgets:
- name: 服务器
  script_name: 服务器监控

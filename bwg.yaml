name: "服务器监控 Merged"
description: "服务器监控小组件，ServerEgern 视觉风格 + 流量统计，支持所有 Widget 尺寸及锁屏组件"

env_schema:
  host:
    name: 主机地址
    description: SSH 服务器地址（必填）
    default_value: ""
  port:
    name: 端口
    description: SSH 端口号
    default_value: "22"
  username:
    name: 用户名
    description: SSH 登录用户名
    default_value: "root"
  password:
    name: 密码
    description: "SSH 密码（与私钥二选一）"
    default_value: ""
  privateKey:
    name: 私钥
    description: "SSH 私钥（与密码二选一，支持 OpenSSH/PEM 格式，自动修复换行）"
    default_value: ""
  BWH_VEID:
    name: 搬瓦工 VEID
    description: "搬瓦工流量 API —— VEID（可选，不填则使用自定义流量上限）"
    default_value: ""
  BWH_API_KEY:
    name: 搬瓦工 API KEY
    description: "搬瓦工流量 API —— API KEY（可选）"
    default_value: ""
  TRAFFIC_LIMIT:
    name: 月流量上限 (GB)
    description: "未配置搬瓦工 API 时使用，默认 2000 GB"
    default_value: "2000"
  RESET_DAY:
    name: 流量重置日
    description: "每月流量重置日期，默认 1 号"
    default_value: "1"
  MASK_IP:
    name: IP 打码
    description: "是否隐藏 IP 后两段（true / false）"
    default_value: "false"

scriptings:
- generic:
    name: 服务器监控Merged
    script_url: https://raw.githubusercontent.com/your-repo/server-monitor-merged.js

widgets:
- name: 服务器监控
  script_name: 服务器监控Merged
